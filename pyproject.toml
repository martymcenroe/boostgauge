[project]
name = "boostgauge"
version = "1.0.0"
description = "Real-time system monitor styled like a racing tachometer"
authors = [
    {name = "Marty McEnroe",email = "opensource@martymcenroe.ai"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10,<4"
dependencies = [
    "psutil (>=7.2.2,<8.0.0)",
    "pillow (>=12.2.0,<13.0.0)",
    "pystray (>=0.19.5,<0.20.0)"
]

[project.urls]
Homepage = "https://boostgauge.martymcenroe.ai"
Repository = "https://github.com/martymcenroe/boostgauge"
Documentation = "https://github.com/martymcenroe/boostgauge/wiki"
Issues = "https://github.com/martymcenroe/boostgauge/issues"
"Built with AssemblyZero" = "https://github.com/martymcenroe/AssemblyZero"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# importlib mode: the tiered test tree (unit/visual/integration) may reuse
# basenames like test_gauge.py; default prepend mode dies at collection on
# the first duplicate (#129 — killed pipeline phase 3 three times).
addopts = "-ra --strict-markers --import-mode=importlib"

[project.scripts]
boostgauge = "boostgauge.app:main"
